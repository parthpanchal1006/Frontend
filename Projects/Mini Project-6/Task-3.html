<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Links Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f4f5f9;
      }

      .container {
        width: 100%;
        max-width: 440px;
        padding: 30px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 27px;
        color: #222;
        margin-bottom: 8px;
      }

      p {
        color: #777;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .social-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-group {
        position: relative;
      }

      .input-group::before {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 21px;
        z-index: 1;
      }

      .instagram::before {
        content: "📸";
      }

      .linkedin::before {
        content: "💼";
      }

      .youtube::before {
        content: "▶️";
      }

      .facebook::before {
        content: "📘";
      }

      .github::before {
        content: "🐙";
      }

      .input-group input {
        width: 100%;
        height: 52px;
        padding: 0 14px 0 52px;
        border: 1px solid #ddd;
        border-radius: 10px;
        outline: none;
        font-size: 14px;
        background: #fafafa;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: #e23744;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(226, 55, 68, 0.1);
      }

      .input-group input::placeholder {
        color: #999;
      }

      button {
        height: 50px;
        border: none;
        border-radius: 10px;
        background: #e23744;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #c92735;
      }

      @media (max-width: 480px) {
        .container {
          padding: 22px 18px;
        }

        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Social Links</h1>
      <p>Add your social media profile URLs</p>

      <form class="social-form">
        <div class="input-group instagram">
          <input type="url" placeholder="Instagram profile URL" />
        </div>

        <div class="input-group linkedin">
          <input type="url" placeholder="LinkedIn profile URL" />
        </div>

        <div class="input-group youtube">
          <input type="url" placeholder="YouTube channel URL" />
        </div>

        <div class="input-group facebook">
          <input type="url" placeholder="Facebook profile URL" />
        </div>

        <div class="input-group github">
          <input type="url" placeholder="GitHub profile URL" />
        </div>

        <button type="submit">Save Social Links</button>
      </form>
    </div>
  </body>
</html>
