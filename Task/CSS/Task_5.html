<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      ul {
        list-style: none;
      }
      ul li {
        display: inline-block;
        background-color: rgb(40, 24, 24);
        padding: 10px 25px;
        position: relative;
      }
      ul li a {
        color: white;
        text-decoration: none;
      }
      ul li::after {
        position: absolute;
        content: "";
        background-color: red;
        width: 0%;
        height: 5px;
        top: 100%;
        left: 0;
        transition: 0.6s;
      }
      ul li::before {
        position: absolute;
        content: "";
        background-color: red;
        width: 0%;
        height: 5px;
        top: -5%;
        right: 0;
        transition: 0.6s;
      }

      li:hover::after {
        width: 100%;
      }
      li:hover::before {
        width: 100%;
      }
      
    </style>
  </head>
  <body>
    <ul>
      <li><a href="">Home</a></li>
      <li><a href="">About</a></li>
      <li><a href="">Contact</a></li>
      <li><a href="">help</a></li>
    </ul>
  </body>
</html>
