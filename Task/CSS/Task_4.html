<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task-4</title>

    <style>
      .main {
        height: 400px;
        width: 50%;
        background-image: url("https://demo.w3layouts.com/demos_new/template_demo/20-06-2017/elite_shoppy-demo_Free/1660570665/web/images/bot_1.jpg");
        margin: 150px auto;
        overflow: hidden;

        position: relative;
      }

      .right {
        height: 400px;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.1);
        color: white;

        position: absolute;
        top: 0;
        left: 0;

        transform: translate(100%, -100%);
        transition: 0.6s;
      }

      .main:hover .right {
        transform: translate(0, 0);
      }

      .left {
        height: 400px;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.1);

        color: white;

        position: absolute;
        top: 100%;
        left: 0;

        transform: translateX(-100%);
        transition: 0.6s;
      }

      .main:hover .left {
        transform: translate(0, -100%);
      }
      h1 {
        margin-top: 170px;
        text-align: center;
        color: white;
        font-size: 50px;
      }
      h1 span {
        color: #26b094;
      }
    </style>
  </head>

  <body>
    <div class="main">
      <h1>Flat <span>50%</span> offer</h1>
      <div class="right"></div>
      <div class="left"></div>
    </div>
  </body>
</html>
