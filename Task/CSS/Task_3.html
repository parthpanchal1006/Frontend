<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task-3</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .demo {
        overflow: hidden;
        height: 300px;
        width: 530px;
      }

      .main {
        height: 300px;
        width: 550px;
        border: 2px solid;
        background: url("https://demo.w3layouts.com/demos_new/template_demo/20-06-2017/elite_shoppy-demo_Free/1660570665/web/images/bottom1.jpg");
        background-size: 100% 100%;
        transform: translateX(-20px);
        transition: 0.6s;
      }

      .border {
        border: 5px solid white;
        height: 200px;
        width: 450px;
        margin: 50px auto;
        transform: translateX(-20px);
        transition: 0.6s;
        font-size: 30px;
        color: white;
        font-weight: bold;
        letter-spacing: 5px;
        text-align: right;
        line-height: 200px;
        opacity: 0;
      }

      .main:hover {
        transform: translateX(0px);
      }

      .main:hover .border {
        transform: translateX(-10px);
        opacity: 1;
      }
      .content {
        color: white;
        font-weight: bold;
        font-size: 30px;
        position: absolute;
        right: 80px;
        top: 90px;
      }
      .content::first-letter {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="demo">
      <div class="main">
        <div class="content">FALL AHEAD</div>
        <div class="border">New Arrivals</div>
      </div>
    </div>
  </body>
</html>
