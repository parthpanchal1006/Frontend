<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task-1</title>
    <style>
      body {
        height: 100vh;
        background-color: black;
        text-align: center;
      }
      .shop-btn {
        margin-top: 300px;
        padding: 15px 40px;
        background: #2ed3b7;
        color: white;
        border: none;
        font-size: 2em;
        transition: outline-offset 0.2s;
      }

      .shop-btn:hover {
        outline: 4px solid #2ed3b7;
        outline-offset: 7px;
      }
    </style>
  </head>
  <body>
    <button class="shop-btn">Shop Now</button>
  </body>
</html>
