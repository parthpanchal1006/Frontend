<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 align="center">Sign Up</h1>

    <form>
      <table align="center" cellpadding="5">
        <tr>
          <td>First, Last Name*:</td>
          <td>
            <input type="text" name="first_name" required />
            <input type="text" name="last_name" required />
          </td>
        </tr>

        <tr>
          <td>Organization:</td>
          <td><input type="text" name="organization" size="50" /></td>
        </tr>

        <tr>
          <td>Email address*:</td>
          <td><input type="email" name="email" size="50" required /></td>
        </tr>

        <tr>
          <td>Work Phone:</td>
          <td><input type="tel" name="work_phone" size="40" /></td>
        </tr>

        <tr>
          <td>Home Phone:</td>
          <td><input type="tel" name="home_phone" size="40" /></td>
        </tr>

        <tr>
          <td>Cell Phone:</td>
          <td><input type="tel" name="cell_phone" size="40" /></td>
        </tr>

        <tr>
          <td>Fax:</td>
          <td><input type="text" name="fax" size="40" /></td>
        </tr>

        <tr>
          <td>Address 1*:</td>
          <td><input type="text" name="address1" size="55" required /></td>
        </tr>

        <tr>
          <td>Address 2:</td>
          <td><input type="text" name="address2" size="55" /></td>
        </tr>

        <tr>
          <td>City*:</td>
          <td><input type="text" name="city" size="50" required /></td>
        </tr>

        <tr>
          <td>State Province:</td>
          <td><input type="text" name="state" size="50" /></td>
        </tr>

        <tr>
          <td>Zip Postal Code:</td>
          <td><input type="text" name="zip" size="15" /></td>
        </tr>

        <tr>
          <td>Country*:</td>
          <td><input type="text" name="country" size="50" required /></td>
        </tr>

        <tr>
          <td>* - required fields</td>
          <td><input type="submit" value="Submit" /></td>
        </tr>

       
      </table>
    </form>
  </body>
</html>
