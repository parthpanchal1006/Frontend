<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Style Product Cards</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f1f3f6;
        font-family: Arial, sans-serif;
      }

      .navbar {
        background-color: #2874f0;
      }

      .product-card {
        border: none;
        border-radius: 8px;
        transition: transform 0.3s;
        height: 100%;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-img {
        height: 200px;
        object-fit: contain;
        padding: 15px;
      }

      .price {
        color: #212121;
        font-size: 22px;
        font-weight: bold;
      }

      .buy-btn {
        background-color: #fb641b;
        color: white;
        border: none;
      }

      .buy-btn:hover {
        background-color: #e85b16;
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Flipkart Store</a>
      </div>
    </nav>
    <div class="container">
      <h2 class="mb-4">Featured Products</h2>

      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4">
          <div class="card product-card shadow-sm">
            <img
              src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
              class="card-img-top product-img"
              alt="Wireless headphones"
            />

            <div class="card-body">
              <h5 class="card-title">Wireless Headphones</h5>
              <p class="text-muted">Bluetooth, premium sound</p>
              <p class="price">₹1,499</p>
              <p class="text-success">20% off</p>
              <button class="btn buy-btn w-100">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
          <div class="card product-card shadow-sm">
            <img
              src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
              class="card-img-top product-img"
              alt="Wrist watch"
            />

            <div class="card-body">
              <h5 class="card-title">Classic Wrist Watch</h5>
              <p class="text-muted">Stylish everyday watch</p>
              <p class="price">₹999</p>
              <p class="text-success">30% off</p>
              <button class="btn buy-btn w-100">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
          <div class="card product-card shadow-sm">
            <img
              src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
              class="card-img-top product-img"
              alt="Red sports shoes"
            />

            <div class="card-body">
              <h5 class="card-title">Sports Shoes</h5>
              <p class="text-muted">Comfortable running shoes</p>
              <p class="price">₹1,799</p>
              <p class="text-success">25% off</p>
              <button class="btn buy-btn w-100">Buy Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
