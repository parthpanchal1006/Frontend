<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyShow Movie Grid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 30px;
      }

      h1 {
        color: #333;
        margin-bottom: 25px;
      }

      .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 25px;
      }

      .movie-card {
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 3px 10px #00000020;
      }

      .poster {
        position: relative;
        width: 100%;
        height: 280px;
      }

      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .new-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        background-color: #e50914;
        color: white;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: bold;
      }

      .movie-info {
        padding: 15px;
      }

      .movie-info h2 {
        font-size: 18px;
        margin-bottom: 8px;
        color: #222;
      }

      .movie-info p {
        color: #777;
        font-size: 14px;
      }

      .rating {
        margin-top: 12px;
        color: #333;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Recommended Movies</h1>

    <div class="movie-grid">
      <div class="movie-card">
        <div class="poster">
          <img
            src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=500"
            alt="Movie poster"
          />
          <span class="new-badge">NEW</span>
        </div>

        <div class="movie-info">
          <h2>Action Night</h2>
          <p>Action • Thriller</p>
          <div class="rating">⭐ 8.5/10</div>
        </div>
      </div>

      <div class="movie-card">
        <div class="poster">
          <img
            src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500"
            alt="Cinema movie poster"
          />
        </div>

        <div class="movie-info">
          <h2>Movie Magic</h2>
          <p>Drama • Adventure</p>
          <div class="rating">⭐ 8.2/10</div>
        </div>
      </div>

      <div class="movie-card">
        <div class="poster">
          <img
            src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=500"
            alt="Movie theatre poster"
          />
        </div>

        <div class="movie-info">
          <h2>Dream World</h2>
          <p>Fantasy • Drama</p>
          <div class="rating">⭐ 9.0/10</div>
        </div>
      </div>

      <div class="movie-card">
        <div class="poster">
          <img
            src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=500"
            alt="Film camera poster"
          />
        </div>

        <div class="movie-info">
          <h2>Dark Mystery</h2>
          <p>Mystery • Thriller</p>
          <div class="rating">⭐ 8.7/10</div>
        </div>
      </div>
    </div>
  </body>
</html>
