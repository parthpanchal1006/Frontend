<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Tile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f1f3f6;
        padding: 40px;
      }

      .product-card {
        width: 260px;
        background-color: white;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-align: center;
        margin: auto;
        box-shadow: 0 2px 8px #00000015;
      }

      .product-card img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        margin: 0 auto 15px;
      }

      .product-name {
        display: block;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .product-price {
        display: inline-block;
        color: #388e3c;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .old-price {
        display: inline-block;
        color: #878787;
        text-decoration: line-through;
        font-size: 14px;
        margin-left: 5px;
      }

      .hide-price .product-price,
      .hide-price .old-price {
        display: none;
      }

      .buy-btn {
        display: block;
        background-color: #2874f0;
        color: white;
        text-decoration: none;
        padding: 10px;
        border-radius: 5px;
        font-weight: bold;
      }

      .buy-btn:hover {
        background-color: #1557c0;
      }
    </style>
  </head>

  <body>
    <div class="product-card">
      <img
        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
        alt="Wireless headphones"
      />

      <span class="product-name">Wireless Headphones</span>

      <span class="product-price">₹1,499</span>
      <span class="old-price">₹2,999</span>

      <a href="#" class="buy-btn">Buy Now</a>
    </div>
  </body>
</html>
