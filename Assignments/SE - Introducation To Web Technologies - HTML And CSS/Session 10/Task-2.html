<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Card</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f1f3f6;
        font-family: Arial, sans-serif;
      }

      .product-card {
        width: 100%;
        max-width: 300px;
        border: none;
        border-radius: 8px;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .product-img {
        height: 220px;
        object-fit: contain;
        padding: 20px;
      }

      .product-price {
        font-size: 23px;
        font-weight: bold;
        color: #212121;
      }

      .old-price {
        color: #878787;
        text-decoration: line-through;
        font-size: 14px;
      }

      .discount {
        color: #388e3c;
        font-size: 14px;
        font-weight: bold;
      }

      .buy-btn {
        background-color: #2874f0;
        color: white;
        border: none;
        width: 100%;
        padding: 10px;
        font-weight: bold;
      }

      .buy-btn:hover {
        background-color: #0b57d0;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">Featured Products</h2>

      <div class="row justify-content-center">
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center"
        >
          <div class="card product-card shadow-sm">
            <img
              src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
              class="card-img-top product-img"
              alt="Wireless Headphones"
            />

            <div class="card-body">
              <h5 class="card-title">Wireless Headphones</h5>

              <p class="card-text text-secondary">
                High-quality sound with a comfortable design.
              </p>

              <div class="mb-3">
                <span class="product-price">₹1,499</span>
                <span class="old-price ms-2">₹2,999</span>
              </div>

              <p class="discount">50% off</p>

              <button class="btn buy-btn" type="button">Buy Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
