<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Playlist App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }

      .navbar {
        background-color: #000;
        padding: 15px 25px;
      }

      .navbar-brand {
        color: #1db954;
        font-size: 25px;
        font-weight: bold;
      }

      .navbar-brand:hover {
        color: #1ed760;
      }

      .navbar .nav-link {
        color: #fff;
        margin: 0 10px;
        transition: color 0.3s;
      }

      .navbar .nav-link:hover,
      .navbar .nav-link.active {
        color: #1db954;
      }

      .hero {
        text-align: center;
        padding: 100px 20px;
      }

      .hero h1 {
        font-size: clamp(30px, 5vw, 50px);
        font-weight: bold;
      }

      .hero p {
        color: #b3b3b3;
      }

      .btn-music {
        background-color: #1db954;
        color: #000;
        border-radius: 25px;
        padding: 10px 25px;
        font-weight: bold;
      }

      .btn-music:hover {
        background-color: #1ed760;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">♫ Musicify</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#musicNavbar"
          aria-controls="musicNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="musicNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#playlists">Playlists</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#profile">Profile</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero">
      <h1>Your Music. Your Vibe.</h1>
      <p>Discover your favorite songs and create your own playlists.</p>
      <a href="#playlists" class="btn btn-music mt-3"> Explore Playlists </a>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
