<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Filters</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }

      .filter-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .filter-buttons .btn {
        border-radius: 25px;
      }

      .filter-buttons .btn.active {
        background-color: #dc3545;
        color: white;
        border-color: #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <h2 class="mb-4">Explore Food</h2>

      <div class="filter-buttons">
        <button type="button" class="btn btn-outline-danger active">All</button>

        <button type="button" class="btn btn-outline-danger">Veg</button>

        <button type="button" class="btn btn-outline-danger">Non-Veg</button>

        <button type="button" class="btn btn-outline-danger">Desserts</button>
      </div>
    </div>

    <script>
      const buttons = document.querySelectorAll(".filter-buttons .btn");

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
        });
      });
    </script>
  </body>
</html>
