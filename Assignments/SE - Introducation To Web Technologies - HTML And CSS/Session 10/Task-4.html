<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Review</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f8f8f8;
      }

      .review-form {
        max-width: 500px;
        margin: 50px auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
      }

      .stars {
        color: #e23744;
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="review-form shadow-sm">
        <h2 class="text-center mb-2" style="color: #e23744">
          Restaurant Review
        </h2>

        <p class="text-center text-secondary mb-4">
          Share your dining experience!
        </p>

        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="rating" class="form-label">Rate Your Experience</label>
            <select class="form-select" id="rating" required>
              <option value="" selected disabled>Select rating</option>
              <option value="5">★★★★★ - Excellent</option>
              <option value="4">★★★★ - Very Good</option>
              <option value="3">★★★ - Good</option>
              <option value="2">★★ - Average</option>
              <option value="1">★ - Poor</option>
            </select>
            <div class="stars mt-1">★★★★★</div>
          </div>

          <div class="mb-3">
            <label for="review" class="form-label">Your Review</label>
            <textarea
              class="form-control"
              id="review"
              rows="4"
              placeholder="Write your restaurant experience..."
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="btn w-100 text-white"
            style="background-color: #e23744"
          >
            Submit Review
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
