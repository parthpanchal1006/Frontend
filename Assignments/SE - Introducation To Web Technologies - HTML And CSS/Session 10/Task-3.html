<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Carousel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .movie-poster {
        height: 400px;
        object-fit: cover;
      }

      .carousel {
        max-width: 600px;
        margin: auto;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <h2 class="mb-4 fw-bold text-center">Recommended Movies</h2>

      <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button
            data-bs-target="#movieCarousel"
            data-bs-slide-to="0"
            class="active"
            aria-label="Movie 1"
          ></button>
          <button
            data-bs-target="#movieCarousel"
            data-bs-slide-to="1"
            aria-label="Movie 2"
          ></button>
          <button
            data-bs-target="#movieCarousel"
            data-bs-slide-to="2"
            aria-label="Movie 3"
          ></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg"
              class="d-block w-100 movie-poster"
              alt="Oppenheimer poster"
            />

            <div class="text-center bg-white p-3">
              <h5 class="fw-bold">Oppenheimer</h5>
              <p class="text-secondary mb-1">Drama • History • Thriller</p>
              <span class="badge bg-danger">★ 8.3/10</span>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
              class="d-block w-100 movie-poster"
              alt="Interstellar poster"
            />

            <div class="text-center bg-white p-3">
              <h5 class="fw-bold">Interstellar</h5>
              <p class="text-secondary mb-1">Sci-Fi • Adventure • Drama</p>
              <span class="badge bg-danger">★ 8.7/10</span>
            </div>
          </div>

          <div class="carousel-item">
            <img
              src="https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg"
              class="d-block w-100 movie-poster"
              alt="The Shawshank Redemption poster"
            />

            <div class="text-center bg-white p-3">
              <h5 class="fw-bold">The Shawshank Redemption</h5>
              <p class="text-secondary mb-1">Drama • Crime</p>
              <span class="badge bg-danger">★ 9.3/10</span>
            </div>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#movieCarousel"
          data-bs-slide="prev"
        >
          <span
            class="carousel-control-prev-icon bg-dark rounded-circle"
          ></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#movieCarousel"
          data-bs-slide="next"
        >
          <span
            class="carousel-control-next-icon bg-dark rounded-circle"
          ></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
