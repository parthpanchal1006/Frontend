<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Product Grid</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f1f3f6;
        padding: 30px;
      }

      h1 {
        margin-bottom: 25px;
        color: #212121;
      }

      /* Desktop: 3 columns */
      .product-section {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .product-card {
        min-width: 0;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      }

      .product-card img {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: contain;
        margin-bottom: 15px;
      }

      .product-card h2 {
        font-size: 18px;
        margin-bottom: 10px;
        color: #212121;
      }

      .product-card p {
        color: #388e3c;
        font-weight: bold;
        font-size: 17px;
      }

      .product-card button {
        margin-top: 15px;
        padding: 10px 18px;
        border: none;
        border-radius: 4px;
        background-color: #2874f0;
        color: white;
        cursor: pointer;
      }

      .product-card button:hover {
        background-color: #1558c0;
      }

      /* Tablet: 2 columns */
      @media screen and (max-width: 768px) {
        body {
          padding: 20px;
        }

        .product-section {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* Mobile: 1 column */
      @media screen and (max-width: 480px) {
        body {
          padding: 15px;
        }

        .product-section {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h1>Top Deals on Flipkart</h1>

    <section class="product-section">
      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLNRbdSQ5OhOOF7CXTdskiuurmAx3Jwep37bAwjC70yQ&s=10"
          alt="Smartphone"
        />
        <h2>Smartphone</h2>
        <p>₹14,999</p>
        <button>View Product</button>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqdpsYCh07Y2VPGd3Rwb4rgnldqEskT_gk5Ay0eI1Htw&s=10"
          alt="Laptop"
        />
        <h2>Laptop</h2>
        <p>₹49,999</p>
        <button>View Product</button>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQngxfTXVhF2c0MONPiiqyG2CkWCjjt57PlY1kUStpUNQ&s=10"
          alt="Headphones"
        />
        <h2>Wireless Headphones</h2>
        <p>₹1,999</p>
        <button>View Product</button>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDHd_p4eoWsXmR3BvLNeGjj4Ah3k2tLl4S8o2bk6ePrg&s=10"
          alt="Smartwatch"
        />
        <h2>Smartwatch</h2>
        <p>₹2,499</p>
        <button>View Product</button>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuQumPysyeufO0BoUrSx4S97ltA83sQSF0kmzz30MNfg&s=10"
          alt="Shoes"
        />
        <h2>Running Shoes</h2>
        <p>₹1,499</p>
        <button>View Product</button>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuOHsMtjUqry4D9PeDvaLQm-Lv49e86JDWJ0n4t-MTEw&s=10"
          alt="Backpack"
        />
        <h2>Travel Backpack</h2>
        <p>₹999</p>
        <button>View Product</button>
      </div>
    </section>
  </body>
</html>
