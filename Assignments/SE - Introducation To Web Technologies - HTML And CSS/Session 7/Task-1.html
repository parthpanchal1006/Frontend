<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social App Icons</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 80%;
        max-width: 600px;
        padding: 25px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .container img {
        width: 60px;
        height: 60px;
        object-fit: contain;
        transition: transform 0.3s ease;
      }

      .container img:hover {
        transform: scale(1.15);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="Instagram" />
      <img src="https://cdn.simpleicons.org/whatsapp/25D366" alt="WhatsApp" />
      <img src="https://cdn.simpleicons.org/zomato/CB202D" alt="Zomato" />
      <img src="https://cdn.simpleicons.org/spotify/1DB954" alt="Spotify" />
    </div>
  </body>
</html>
