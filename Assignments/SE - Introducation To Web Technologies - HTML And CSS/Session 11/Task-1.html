<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Spacing Cards</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="text-center mb-4">Flipkart Product Cards</h2>

      <div class="row">
        <div class="col-md-4">
          <div class="card m-1 p-1 shadow-sm">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2s3TvLU8RqXaujt6LEDKZEfic-t_YJHATRbnIWRl-6A&s=10"
              class="card-img-top"
              alt="Headphones"
            />
            <div class="card-body p-2">
              <h5 class="card-title">Wireless Headphones</h5>
              <p class="text-success mb-0">₹999</p>
              <small>Small spacing: m-1, p-1</small>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card m-2 p-2 shadow-sm">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRz-eREgkeK8kjbhoLIL6E6lj3G3etsYjmsL_RtwGG6A&s=10"
              class="card-img-top"
              alt="Smartwatch"
            />
            <div class="card-body p-3">
              <h5 class="card-title">Smart Watch</h5>
              <p class="text-success mb-0">₹1,499</p>
              <small>Medium spacing: m-2, p-2</small>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card m-3 p-3 shadow-sm">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTETLg9nuM9DwoPIFKCtfTSaKN7H5f2zOftYcXzhEQfCQ&s"
              class="card-img-top"
              alt="Smartphone"
            />
            <div class="card-body p-4">
              <h5 class="card-title">Smartphone</h5>
              <p class="text-success mb-0">₹12,999</p>
              <small>Large spacing: m-3, p-3</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
