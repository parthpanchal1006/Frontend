<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="text-center text-danger fw-bold mb-4">
        Zomato Restaurant List
      </h2>

      <div class="row g-3">
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW35nyHWc7mtev_T1Sy1etVfe6XYLWsG882mrGXWCyqQ&s=10"
              class="card-img-top"
              alt="Pizza restaurant"
            />

            <div class="card-body">
              <h5 class="card-title fw-bold">Pizza Palace</h5>
              <p class="text-secondary mb-2">Pizza • Italian</p>

              <span class="badge bg-success">★ 4.5 Rating</span>
              <span class="badge bg-danger">30% OFF</span>
              <span class="badge bg-success">Open Now</span>

              <p class="text-muted small mt-3 mb-0">Delivery in 25–30 mins</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLQVoaAm25yCJUWh7mCYxSLu9dF6G0p9jHOwz_rsWeDQ&s=10"
              class="card-img-top"
              alt="Burger restaurant"
            />

            <div class="card-body">
              <h5 class="card-title fw-bold">Burger Hub</h5>
              <p class="text-secondary mb-2">Burgers • Fast Food</p>

              <span class="badge bg-success">★ 4.2 Rating</span>
              <span class="badge bg-warning text-dark">Buy 1 Get 1</span>
              <span class="badge bg-danger">Closed</span>

              <p class="text-muted small mt-3 mb-0">Opens tomorrow at 11 AM</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQLLqPAzPAKZsJAnUuQLHmIwk2FEssBIbWmo41Ogq2tQ&s=10"
              class="card-img-top"
              alt="Gujarati thali restaurant"
            />

            <div class="card-body">
              <h5 class="card-title fw-bold">Gujarati Thali House</h5>
              <p class="text-secondary mb-2">Gujarati • Pure Veg</p>

              <span class="badge bg-success">★ 4.7 Rating</span>
              <span class="badge bg-info text-dark">20% OFF</span>
              <span class="badge bg-success">Open Now</span>

              <p class="text-muted small mt-3 mb-0">Delivery in 20–25 mins</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
