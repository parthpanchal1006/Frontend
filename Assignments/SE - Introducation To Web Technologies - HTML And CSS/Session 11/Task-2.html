<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Review Card</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow-sm p-3 mx-auto" style="max-width: 400px">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUq6JXJP_t_xUKWQYHOpjCs3OqAHdQwD_RFdhYlc2FSw&s=10"
          class="card-img-top rounded"
          alt="Movie poster"
        />

        <div class="card-body">
          <h3 class="fw-bold fs-4 mb-2">Avengers: Endgame</h3>

          <p class="fw-bold fs-5 text-danger mb-2">★ 4.8/5</p>

          <p class="fw-semibold fs-6 text-dark mb-2">
            Amazing Movie Experience!
          </p>

          <p class="fw-normal small text-secondary">
            A fantastic superhero movie with emotional moments, incredible
            action, and an unforgettable ending. A must-watch for Marvel fans.
          </p>

          <p class="text-muted small mb-0">Reviewed by MovieFan123</p>
        </div>
      </div>
    </div>
  </body>
</html>
