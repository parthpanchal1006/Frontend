<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark and Light Mode</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body id="body" class="bg-light text-dark">
    <div class="container text-center py-5">
      <h1>BookMyShow</h1>
      <p>Book your favorite movie tickets!</p>

      <button id="themeBtn" class="btn btn-primary">Dark Mode</button>
    </div>

    <script>
      const body = document.getElementById("body");
      const themeBtn = document.getElementById("themeBtn");

      themeBtn.addEventListener("click", function () {
        if (body.classList.contains("bg-light")) {
          body.classList.replace("bg-light", "bg-dark");
          body.classList.replace("text-dark", "text-light");
          themeBtn.textContent = "Light Mode";
        } else {
          body.classList.replace("bg-dark", "bg-light");
          body.classList.replace("text-light", "text-dark");
          themeBtn.textContent = "Dark Mode";
        }
      });
    </script>
  </body>
</html>
