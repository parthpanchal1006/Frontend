<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Featured Playlists</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }

      .playlist-card {
        background-color: #202020;
        padding: 18px;
        border-radius: 12px;
        height: 100%;
        transition: 0.3s;
      }

      .playlist-card:hover {
        background-color: #303030;
        transform: translateY(-5px);
      }

      .playlist-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .playlist-card h5 {
        font-weight: bold;
      }

      .playlist-card p {
        color: #b3b3b3;
        font-size: 14px;
      }

      .listen-btn {
        background-color: #1ed760;
        color: #121212;
        border: none;
        border-radius: 25px;
        padding: 9px 20px;
        font-weight: bold;
      }

      .listen-btn:hover {
        background-color: #1fef68;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <h2 class="fw-bold mb-2">Featured Playlists</h2>
      <p class="text-secondary mb-4">Discover your next favorite sound.</p>

      <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="playlist-card">
            <img
              src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600"
              alt="Electronic music concert"
            />

            <h5>Party Hits</h5>
            <p>Feel the beat with energetic party tracks.</p>

            <a
              href="https://open.spotify.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="btn listen-btn"
            >
              Listen Now
            </a>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="playlist-card">
            <img
              src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=600"
              alt="Singer performing on stage"
            />

            <h5>Chill Vibes</h5>
            <p>Relax and unwind with smooth melodies.</p>

            <a
              href="https://open.spotify.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="btn listen-btn"
            >
              Listen Now
            </a>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="playlist-card">
            <img
              src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=600"
              alt="Guitar and music performance"
            />

            <h5>Acoustic Sessions</h5>
            <p>Enjoy beautiful acoustic songs and melodies.</p>

            <a
              href="https://open.spotify.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="btn listen-btn"
            >
              Listen Now
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
