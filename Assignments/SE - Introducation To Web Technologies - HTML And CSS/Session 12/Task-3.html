<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Showcase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f1f3f6;
        font-family: Arial, sans-serif;
      }

      .navbar {
        background-color: #2874f0;
      }

      .navbar-brand {
        color: white;
        font-weight: bold;
      }

      .product-card {
        border: none;
        border-radius: 5px;
        height: 100%;
        transition: 0.3s;
      }

      .product-card:hover {
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        transform: translateY(-4px);
      }

      .product-img {
        height: 180px;
        width: 100%;
        object-fit: contain;
        padding: 15px;
      }

      .product-title {
        font-size: 15px;
        font-weight: 600;
      }

      .price {
        color: #212121;
        font-size: 18px;
        font-weight: bold;
      }

      .old-price {
        color: #878787;
        font-size: 13px;
        text-decoration: line-through;
      }

      .buy-btn {
        background-color: #fb641b;
        color: white;
        border: none;
      }

      .buy-btn:hover {
        background-color: #e85b16;
        color: white;
      }

      @media (max-width: 576px) {
        .product-img {
          height: 130px;
        }

        .product-title {
          font-size: 13px;
        }

        .price {
          font-size: 15px;
        }

        .card-body {
          padding: 12px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Flipkart Store</a>
        <span class="text-white">Explore Products</span>
      </div>
    </nav>

    <div class="container my-5">
      <h3 class="fw-bold mb-4">Best Deals for You</h3>

      <div class="row g-3">
        <div class="col-6 col-md-3">
          <div class="card product-card">
            <img
              src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
              class="card-img-top product-img"
              alt="Wireless headphones"
            />

            <div class="card-body">
              <h5 class="product-title">Wireless Headphones</h5>
              <p class="text-success mb-2">40% off</p>
              <span class="price">₹1,499</span>
              <span class="old-price">₹2,499</span>

              <button class="btn buy-btn btn-sm w-100 mt-3">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="card product-card">
            <img
              src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
              class="card-img-top product-img"
              alt="Smart watch"
            />

            <div class="card-body">
              <h5 class="product-title">Smart Watch</h5>
              <p class="text-success mb-2">30% off</p>
              <span class="price">₹2,099</span>
              <span class="old-price">₹2,999</span>

              <button class="btn buy-btn btn-sm w-100 mt-3">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="card product-card">
            <img
              src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
              class="card-img-top product-img"
              alt="Red sports shoes"
            />

            <div class="card-body">
              <h5 class="product-title">Sports Shoes</h5>
              <p class="text-success mb-2">25% off</p>
              <span class="price">₹1,799</span>
              <span class="old-price">₹2,399</span>

              <button class="btn buy-btn btn-sm w-100 mt-3">Buy Now</button>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card product-card">
            <img
              src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400"
              class="card-img-top product-img"
              alt="Instant camera"
            />

            <div class="card-body">
              <h5 class="product-title">Instant Camera</h5>
              <p class="text-success mb-2">20% off</p>
              <span class="price">₹3,999</span>
              <span class="old-price">₹4,999</span>

              <button class="btn buy-btn btn-sm w-100 mt-3">Buy Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
