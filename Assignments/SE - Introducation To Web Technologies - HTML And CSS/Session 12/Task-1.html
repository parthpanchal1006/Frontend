<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Artist | Alex Morgan</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="Task-1.css" />
  </head>
  <body>
    <main class="artist-card">
      <img
        src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400"
        alt="Artist profile"
        class="profile-img"
      />

      <h1>Alex Morgan</h1>
      <p class="role">Singer • Songwriter • Music Producer</p>

      <p class="bio">
        Creating music that connects hearts and inspires souls. Explore my
        latest tracks, follow my journey, and join me on this musical adventure.
      </p>

      <div class="social-links">
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn instagram"
        >
          <i class="bi bi-instagram"></i>
          Instagram
        </a>

        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn youtube"
        >
          <i class="bi bi-youtube"></i>
          YouTube
        </a>

        <a
          href="https://open.spotify.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn spotify"
        >
          <i class="bi bi-spotify"></i>
          Spotify
        </a>
      </div>

      <footer>© 2026 Alex Morgan. All rights reserved.</footer>
    </main>
  </body>
</html>
