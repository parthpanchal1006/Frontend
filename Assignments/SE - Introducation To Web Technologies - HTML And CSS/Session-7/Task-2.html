<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Playlist Bar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px 20px;
      }

      h1 {
        margin-bottom: 25px;
        color: #1ed760;
        text-align: center;
      }

      .playlist {
        display: flex;
        justify-content: center;
        gap: 15px;
        overflow-x: auto;
        padding: 10px 0 20px;
      }

      .song-card {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 240px;
        padding: 15px;
        background-color: #242424;
        border-radius: 10px;
        transition: background-color 0.3s ease;
      }

      .song-card:hover {
        background-color: #333333;
      }

      .song-number {
        color: #1ed760;
        font-size: 20px;
        font-weight: bold;
      }

      .song-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .song-info h3 {
        font-size: 16px;
      }

      .song-info p {
        color: #b3b3b3;
        font-size: 13px;
      }

      .play-button {
        margin-left: auto;
        color: #1ed760;
        font-size: 22px;
      }
    </style>
  </head>

  <body>
    <h1>My Playlist</h1>

    <div class="playlist">
      <div class="song-card">
        <span class="song-number">01</span>
        <div class="song-info">
          <h3>Blinding Lights</h3>
          <p>The Weeknd</p>
        </div>
        <span class="play-button">
          <i class="fa-solid fa-play" style="color: rgb(30, 215, 96)"></i>
        </span>
      </div>

      <div class="song-card">
        <span class="song-number">02</span>
        <div class="song-info">
          <h3>Shape of You</h3>
          <p>Ed Sheeran</p>
        </div>
        <span class="play-button">
          <i class="fa-solid fa-play" style="color: rgb(30, 215, 96)"></i>
        </span>
      </div>

      <div class="song-card">
        <span class="song-number">03</span>
        <div class="song-info">
          <h3>Perfect</h3>
          <p>Ed Sheeran</p>
        </div>
        <span class="play-button">
          <i class="fa-solid fa-play" style="color: rgb(30, 215, 96)"></i>
        </span>
      </div>

      <div class="song-card">
        <span class="song-number">04</span>
        <div class="song-info">
          <h3>Starboy</h3>
          <p>The Weeknd</p>
        </div>
        <span class="play-button">
          <i class="fa-solid fa-play" style="color: rgb(30, 215, 96)"></i>
        </span>
      </div>

      <div class="song-card">
        <span class="song-number">05</span>
        <div class="song-info">
          <h3>Levitating</h3>
          <p>Dua Lipa</p>
        </div>
        <span class="play-button">
          <i class="fa-solid fa-play" style="color: rgb(30, 215, 96)"></i>
        </span>
      </div>
    </div>
  </body>
</html>
