<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Card</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color: f5f5f5">
    <div
      style="
        width: 250px;
        background-color: white;
        padding: 20px;
        box-shadow: 5px 10px 20px rgba(0, 0, 0, 0.5);
        margin: 50px auto;
        text-align: center;
        border-radius: 20px;
      "
    >
      <img
        src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcTN6HNg9EsvFXS3n4jtFiy3-UoLUyHsJ91FpHSLbUA3Ik0-0nBNviIw_cHnG1ZwQulbgdEkiCFL7IJ4-zePIXbg7iR-wY6TBGqFcYIQQIm_nCoF7ndc4y7xCAdm4pvMkgssjCzepN8&usqp=CAc"
        alt="Smartphone"
        width="200"
      />

      <h2
        style="
          background-color: #fff2cc;
          font-size: 24px;
          text-transform: capitalize;
        "
      >
        samsung galaxy
      </h2>

      <p>8GB RAM | 128GB Storage</p>

      <p><strong>Price: ₹14,999</strong></p>

      <p style="color: green">Special Offer Available!</p>

      <button
        style="
          background-color: #2874f0;
          color: white;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
        "
      >
        Add to Cart
      </button>
    </div>
  </body>
</html>
