<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify playlist</title>
    <style>
      .playlist-item {
        background-color: #181818;
        color: white;
        padding: 15px;
        margin: 8px 0;
        border-radius: 8px;
      }

      #currently-playing {
        background-color: #1db954;
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="playlist-item">Song 1 - Perfect</div>

    <div class="playlist-item" id="currently-playing">
      Song 2 - Shape of You (Now Playing)
    </div>

    <div class="playlist-item">Song 3 - Believer</div>
  </body>
</html>
