<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myntra Offer Banner</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 30px;
      }

      .offer-banner {
        background-color: #282c3f;
        color: #ffffff;
        font-family: Georgia, serif;
        text-align: center;
        padding: 35px 20px;
        border-radius: 8px;
      }

      .offer-banner h1 {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .offer-banner p {
        font-size: 18px;
      }

      .offer-banner .discount {
        color: #ffcc33;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="offer-banner">
      <h1>BIG FASHION SALE</h1>
      <p>Upgrade Your Style Today!</p>
      <p class="discount">FLAT 50% OFF</p>
      <p>Shop Now and Enjoy Exclusive Deals</p>
    </div>
  </body>
</html>
