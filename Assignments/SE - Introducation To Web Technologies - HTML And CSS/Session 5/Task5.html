<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyShow Movie Details</title>
    <style>
      #theme-toggle {
        display: none;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #222;
        margin: 0;
        padding: 20px;
        transition: 0.3s;
      }

      header {
        background-color: #e91e63;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 8px;
      }

      .movie-card {
        max-width: 450px;
        margin: 30px auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
      }

      .movie-card img {
        width: 100%;
        border-radius: 8px;
      }

      .toggle-btn {
        display: inline-block;
        background-color: #222;
        color: white;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
      }

      body:has(#theme-toggle:checked) {
        background-color: #121212;
        color: white;
      }

      body:has(#theme-toggle:checked) .movie-card {
        background-color: #242424;
        color: white;
      }

      body:has(#theme-toggle:checked) header {
        background-color: #181818;
      }

      body:has(#theme-toggle:checked) .toggle-btn {
        background-color: #e91e63;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BookMyShow</h1>
      <p>Discover Movies & Book Tickets</p>

      <input type="checkbox" id="theme-toggle" />

      <label for="theme-toggle" class="toggle-btn">
        Toggle Light / Dark Mode
      </label>
    </header>

    <div class="movie-card">
      <img
        src="https://placehold.co/450x250/333333/ffffff?text=Movie+Poster"
        alt="Movie poster"
      />

      <h2>Avengers: Endgame</h2>
      <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>
      <p><strong>Duration:</strong> 3 hours 2 minutes</p>
      <p><strong>Rating:</strong> ⭐ 8.4/10</p>

      <button
        style="
          background-color: #e91e63;
          color: white;
          padding: 12px;
          border: none;
          border-radius: 5px;
        "
      >
        Book Tickets
      </button>
    </div>
  </body>
</html>
