<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2 - Product Cards</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f1f3f6;
        padding: 25px;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      .product-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }

      .product-card {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 350px;
        padding: 15px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px #0002;
      }

      .product-card img {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }

      .details h2 {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .details p {
        font-size: 14px;
        margin-bottom: 8px;
      }

      .details h3 {
        margin-bottom: 8px;
      }

      button {
        background: #2874f0;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
      }

      @media only screen and (max-width: 600px) {
        body {
          padding: 12px;
        }

        .product-card {
          flex-direction: column;
          align-items: flex-start;
          width: 100%;
          padding: 15px;
        }

        .product-card img {
          width: 100%;
          height: 180px;
        }

        .details h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Task 1: Product Cards</h1>

    <div class="product-container">
      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0i4otNkjEeiznOwXCEuhZ46sI8kmLBR5-uDk_h9sZiQ&s=10 "
          alt="Smartphone"
        />
        <div class="details">
          <h2>Samsung Galaxy Phone</h2>
          <p>⭐ 4.5 Rating</p>
          <h3>₹14,999</h3>
          <p>8GB RAM, 128GB Storage</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9Dpb9T4T8DYaKxqd_6SkUI-lepO3FtvfiZ1SlDTMyVw&s"
          alt="Headphones"
        />
        <div class="details">
          <h2>Wireless Headphones</h2>
          <p>⭐ 4.3 Rating</p>
          <h3>₹1,499</h3>
          <p>Bluetooth, Noise Reduction</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSir6wQTmSnxbPFIiSLC08nF3xm0Z0w4H8WLqsklWxrAw&s"
          alt="Smartwatch"
        />
        <div class="details">
          <h2>Smart Watch</h2>
          <p>⭐ 4.6 Rating</p>
          <h3>₹2,499</h3>
          <p>Fitness Tracking, Heart Rate</p>
          <button>Add to Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
