<!doctype html>
<html>
  <head>
    <title>Society Notice Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="boardTitle">Notice Board</h1>

      <p id="boardDate"></p>

      <ul id="noticeList">
        <li>Water supply maintenance on Monday</li>
        <li class="urgent">Parking cleaning on Saturday</li>
        <li>Society meeting at 7 PM</li>
      </ul>

      <input id="newNotice" value="Lift maintenance on Sunday 9 AM" />

      <p id="noticeCount"></p>
    </div>

    <script src="board.js"></script>
  </body>
</html>
